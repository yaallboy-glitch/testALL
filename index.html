<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NexusOS — Web Desktop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none}

:root{
  --accent:#7c6cff;
  --accent-glow:rgba(124,108,255,.4);
  --panel-bg:rgba(20,20,26,.72);
  --panel-border:rgba(255,255,255,.08);
  --text:#f2f2f7;
  --muted:#8e8e93;
  --taskbar-h:64px;
  --radius:14px;
  --shadow:0 20px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05);
}
body.light{
  --panel-bg:rgba(255,255,255,.72);
  --panel-border:rgba(0,0,0,.08);
  --text:#1c1c1e;
  --muted:#6c6c70;
  --shadow:0 20px 60px -20px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.05);
}

/* ===== DESKTOP ===== */
#desktop{
  position:fixed;inset:0;
  background-size:cover;background-position:center;
  transition:background .6s ease;
  overflow:hidden;
}
#desktop::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.08),transparent 60%);
  pointer-events:none;
}

/* ===== DESKTOP ICONS ===== */
#desktopIcons{
  position:absolute;top:24px;left:24px;
  display:flex;flex-direction:column;gap:14px;
  z-index:5;
}
.d-icon{
  width:88px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 6px;border-radius:12px;cursor:pointer;
  transition:background .2s;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.d-icon:hover{background:rgba(255,255,255,.12)}
.d-icon:active{background:rgba(255,255,255,.2);transform:scale(.96)}
.d-icon .ic{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  box-shadow:0 6px 16px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);
}
.d-icon .lbl{font-size:11.5px;font-weight:500;text-align:center;line-height:1.25}

/* ===== WINDOWS ===== */
#windowsLayer{position:absolute;inset:0;z-index:10;pointer-events:none}
.win{
  position:absolute;pointer-events:auto;
  background:var(--panel-bg);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;
  min-width:280px;min-height:180px;
  color:var(--text);
  animation:winIn .28s cubic-bezier(.2,.9,.3,1.15);
  transition:opacity .18s,transform .18s;
}
.win.minimized{opacity:0;pointer-events:none;transform:scale(.85) translateY(40px)}
@keyframes winIn{
  from{opacity:0;transform:scale(.92) translateY(14px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.win.maximized{border-radius:0}
.win.focused{border-color:var(--accent)}
.win.focused .titlebar{background:linear-gradient(180deg,rgba(255,255,255,.06),transparent)}

.titlebar{
  height:38px;flex-shrink:0;
  display:flex;align-items:center;
  padding:0 12px;gap:10px;
  cursor:grab;touch-action:none;
  border-bottom:1px solid var(--panel-border);
}
.titlebar:active{cursor:grabbing}
.win-controls{display:flex;gap:8px;flex-shrink:0}
.wc{
  width:13px;height:13px;border-radius:50%;border:none;cursor:pointer;
  transition:transform .15s,filter .15s;
  position:relative;
}
.wc:hover{filter:brightness(1.2);transform:scale(1.1)}
.wc.close{background:#ff5f57}
.wc.min{background:#febc2e}
.wc.max{background:#28c840}
.titlebar .ttl{
  flex:1;font-size:12.5px;font-weight:600;
  text-align:center;padding-right:44px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);opacity:.9;
}

.win-body{
  flex:1;overflow:auto;
  padding:16px;
  font-size:13px;line-height:1.55;
}
.win-body::-webkit-scrollbar{width:8px;height:8px}
.win-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.win-body::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.25)}

.resize-handle{
  position:absolute;width:18px;height:18px;right:0;bottom:0;
  cursor:nwse-resize;touch-action:none;
  z-index:5;
}
.resize-handle::after{
  content:'';position:absolute;right:4px;bottom:4px;
  width:8px;height:8px;border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);opacity:.5;
}

/* ===== TASKBAR ===== */
#taskbar{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  height:var(--taskbar-h);
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  background:var(--panel-bg);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--panel-border);
  border-radius:20px;
  box-shadow:0 20px 50px -15px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);
  z-index:1000;
  max-width:calc(100vw - 24px);
}
.tb-btn{
  height:48px;min-width:48px;
  border:none;background:transparent;
  border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  transition:background .18s,transform .12s;
  position:relative;
  color:var(--text);
}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.tb-btn:active{transform:scale(.9)}
.tb-btn.launcher{background:linear-gradient(135deg,var(--accent),#a89bff);color:#fff}
.tb-btn.running::after{
  content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--accent);
}
.tb-btn.active::after{width:16px;border-radius:2px}

.tb-divider{width:1px;height:28px;background:var(--panel-border);margin:0 4px}

#taskItems{display:flex;gap:6px;align-items:center}
.task-item{
  height:48px;padding:0 14px;
  border:none;background:rgba(255,255,255,.05);
  border-radius:12px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  color:var(--text);font-size:12.5px;font-weight:500;
  transition:background .18s,transform .12s;
  max-width:160px;
  font-family:inherit;
}
.task-item:hover{background:rgba(255,255,255,.1)}
.task-item.focused{background:rgba(124,108,255,.2);box-shadow:inset 0 0 0 1px rgba(124,108,255,.4)}
.task-item .ti-icon{font-size:16px;flex-shrink:0}
.task-item .ti-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#tray{display:flex;align-items:center;gap:4px}
.tray-btn{
  height:44px;min-width:44px;padding:0 12px;
  border:none;background:transparent;border-radius:10px;
  cursor:pointer;display:flex;align-items:center;gap:6px;
  color:var(--text);font-size:11.5px;font-weight:600;
  transition:background .18s;
  font-family:inherit;
}
.tray-btn:hover{background:rgba(255,255,255,.1)}
#clock{font-variant-numeric:tabular-nums;letter-spacing:.02em}
#clock .date{display:block;font-size:9.5px;font-weight:500;opacity:.7;line-height:1}

@media(max-width:640px){
  .task-item .ti-name{display:none}
  .task-item{padding:0 12px}
  #tray .hide-mobile{display:none}
  #taskbar{padding:6px;gap:4px;bottom:10px}
  .tb-btn{height:44px;min-width:44px}
}

/* ===== LAUNCHER ===== */
#launcher{
  position:fixed;inset:0;z-index:2000;
  background:rgba(10,10,14,.55);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  display:flex;flex-direction:column;align-items:center;
  padding:60px 24px 100px;
  opacity:0;pointer-events:none;
  transition:opacity .28s ease;
  overflow-y:auto;
}
#launcher.show{opacity:1;pointer-events:auto}
#launcherSearch{
  width:min(520px,100%);
  padding:14px 20px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;
  color:#fff;font-size:15px;font-family:inherit;
  outline:none;margin-bottom:40px;
  transition:border-color .2s,background .2s;
}
#launcherSearch:focus{border-color:var(--accent);background:rgba(255,255,255,.14)}
#launcherSearch::placeholder{color:rgba(255,255,255,.5)}
#appGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:20px;
  width:min(720px,100%);
}
.app-tile{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:18px 8px;border-radius:16px;cursor:pointer;
  transition:background .2s,transform .15s;
  color:#fff;border:none;background:transparent;
  font-family:inherit;
}
.app-tile:hover{background:rgba(255,255,255,.1)}
.app-tile:active{transform:scale(.94)}
.app-tile .ic{
  width:64px;height:64px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  box-shadow:0 10px 24px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);
}
.app-tile .nm{font-size:12.5px;font-weight:500;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* ===== QUICK SETTINGS ===== */
#quickSettings{
  position:fixed;bottom:90px;right:20px;z-index:1500;
  width:min(320px,calc(100vw - 40px));
  background:var(--panel-bg);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--panel-border);
  border-radius:18px;padding:16px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  color:var(--text);
  transform-origin:bottom right;
  transform:scale(.9) translateY(10px);
  opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.15),opacity .2s;
}
#quickSettings.show{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
.qs-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.qs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.qs-tile{
  padding:12px;border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--panel-border);
  cursor:pointer;transition:background .18s;
  display:flex;align-items:center;gap:10px;
  color:var(--text);font-size:12px;font-weight:500;
  font-family:inherit;
}
.qs-tile:hover{background:rgba(255,255,255,.12)}
.qs-tile.on{background:var(--accent);border-color:var(--accent);color:#fff}
.qs-tile .ic{font-size:16px}

.slider{
  -webkit-appearance:none;width:100%;height:4px;
  background:rgba(255,255,255,.15);border-radius:2px;outline:none;
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);cursor:pointer;
  box-shadow:0 0 0 4px var(--accent-glow);
}
.slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}

.color-dots{display:flex;gap:8px;margin-top:8px}
.color-dot{
  width:28px;height:28px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:transform .15s;
}
.color-dot:hover{transform:scale(1.15)}
.color-dot.active{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}

.wallpaper-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.wp-thumb{
  aspect-ratio:1;border-radius:8px;cursor:pointer;
  border:2px solid transparent;transition:transform .15s;
  background-size:cover;background-position:center;
}
.wp-thumb:hover{transform:scale(1.06)}
.wp-thumb.active{border-color:var(--accent)}

/* ===== COMMAND PALETTE ===== */
#cmdPalette{
  position:fixed;inset:0;z-index:3000;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:20vh;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
#cmdPalette.show{opacity:1;pointer-events:auto}
#cmdBox{
  width:min(560px,92vw);
  background:var(--panel-bg);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--panel-border);
  border-radius:16px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.8);
  transform:scale(.96);transition:transform .25s cubic-bezier(.2,.9,.3,1.15);
}
#cmdPalette.show #cmdBox{transform:scale(1)}
#cmdInput{
  width:100%;padding:18px 22px;
  background:transparent;border:none;
  color:var(--text);font-size:16px;font-family:inherit;
  outline:none;
}
#cmdInput::placeholder{color:var(--muted)}
#cmdResults{max-height:340px;overflow-y:auto;border-top:1px solid var(--panel-border)}
.cmd-item{
  padding:12px 22px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
  color:var(--text);font-size:13.5px;
  transition:background .15s;
}
.cmd-item:hover,.cmd-item.sel{background:rgba(255,255,255,.08)}
.cmd-item .ci-ic{font-size:18px;width:24px;text-align:center}
.cmd-item .ci-kbd{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:ui-monospace,monospace}

/* ===== APP-SPECIFIC ===== */
/* Terminal */
.terminal{
  background:#0a0a0f!important;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;
  font-size:12.5px;line-height:1.6;
  padding:16px 18px;
  color:#e4e4e7;
}
.terminal .line{white-space:pre-wrap;word-break:break-word}
.terminal .prompt{color:#7c6cff;font-weight:600}
.terminal .path{color:#4ec9b0}
.terminal .ok{color:#4ade80}
.terminal .err{color:#f87171}
.terminal .warn{color:#fbbf24}
.terminal-input{
  background:transparent;border:none;outline:none;
  color:inherit;font:inherit;width:100%;
  padding:0;margin:0;
}
.term-row{display:flex;gap:8px;align-items:center}

/* Notes */
.note-area{
  width:100%;height:100%;min-height:300px;
  background:transparent;border:none;outline:none;
  color:inherit;font-family:inherit;font-size:14px;line-height:1.7;
  resize:none;padding:0;
}
.note-area::placeholder{color:var(--muted)}
.note-meta{font-size:11px;color:var(--muted);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--panel-border)}

/* Files */
.file-list{display:flex;flex-direction:column;gap:2px}
.file-item{
  padding:10px 12px;border-radius:8px;
  display:flex;align-items:center;gap:12px;
  cursor:pointer;transition:background .15s;
  color:var(--text);
}
.file-item:hover{background:rgba(255,255,255,.08)}
.file-item .fi-ic{font-size:20px;width:24px;text-align:center}
.file-item .fi-name{flex:1;font-size:13px;font-weight:500}
.file-item .fi-size{font-size:11px;color:var(--muted)}

/* Calculator */
.calc-display{
  background:rgba(0,0,0,.25);
  border-radius:12px;padding:18px;
  text-align:right;margin-bottom:12px;
  font-family:ui-monospace,monospace;
}
.calc-display .expr{font-size:12px;color:var(--muted);min-height:16px}
.calc-display .val{font-size:32px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-btn{
  aspect-ratio:1.3;border:none;border-radius:10px;
  background:rgba(255,255,255,.08);
  color:var(--text);font-size:17px;font-weight:500;
  cursor:pointer;transition:background .15s,transform .1s;
  font-family:inherit;
}
.calc-btn:hover{background:rgba(255,255,255,.15)}
.calc-btn:active{transform:scale(.94)}
.calc-btn.op{background:rgba(124,108,255,.2);color:#b8b0ff}
.calc-btn.eq{background:var(--accent);color:#fff}
.calc-btn.eq:hover{background:#8a7cff}

/* Music */
.music-player{text-align:center;padding:10px 0}
.music-cover{
  width:180px;height:180px;margin:0 auto 20px;
  border-radius:16px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;align-items:center;justify-content:center;
  font-size:60px;
  box-shadow:0 20px 40px -15px rgba(124,108,255,.5);
  transition:transform .3s;
}
.music-player.playing .music-cover{animation:coverPulse 3s ease-in-out infinite}
@keyframes coverPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.music-title{font-size:16px;font-weight:600;margin-bottom:4px}
.music-artist{font-size:12px;color:var(--muted);margin-bottom:20px}
.music-progress{
  height:4px;background:rgba(255,255,255,.15);border-radius:2px;
  margin:16px 0 8px;overflow:hidden;cursor:pointer;
}
.music-bar{height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width .3s}
.music-time{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.music-ctrl{display:flex;justify-content:center;gap:16px;margin-top:20px}
.music-btn{
  width:44px;height:44px;border-radius:50%;border:none;
  background:rgba(255,255,255,.08);color:var(--text);
  cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .12s;
}
.music-btn:hover{background:rgba(255,255,255,.16)}
.music-btn:active{transform:scale(.92)}
.music-btn.play{width:56px;height:56px;background:var(--accent);font-size:20px}

/* Settings */
.settings-section{margin-bottom:22px}
.settings-section h4{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.settings-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;border-radius:10px;
  background:rgba(255,255,255,.05);
  margin-bottom:6px;font-size:13px;
}
.toggle{
  width:44px;height:26px;border-radius:13px;
  background:rgba(255,255,255,.15);
  border:none;cursor:pointer;position:relative;
  transition:background .2s;
}
.toggle::after{
  content:'';position:absolute;left:3px;top:3px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s;
}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

/* Toast */
#toastContainer{
  position:fixed;bottom:calc(var(--taskbar-h) + 30px);right:20px;
  z-index:4000;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  padding:12px 18px;border-radius:12px;
  background:var(--panel-bg);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--panel-border);
  color:var(--text);font-size:12.5px;
  box-shadow:0 20px 40px -15px rgba(0,0,0,.6);
  animation:toastIn .3s cubic-bezier(.2,.9,.3,1.15);
  display:flex;align-items:center;gap:10px;
}
@keyframes toastIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(60px)}}

/* Boot screen */
#boot{
  position:fixed;inset:0;z-index:9000;
  background:#0a0a0f;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;gap:20px;
  transition:opacity .6s ease;
}
#boot.hide{opacity:0;pointer-events:none}
.boot-logo{font-size:36px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(135deg,#7c6cff,#a89bff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.boot-bar{width:180px;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.boot-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7c6cff,#a89bff);animation:bootLoad 1.6s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes bootLoad{to{width:100%}}
.boot-text{font-size:11px;color:#666;letter-spacing:.15em;text-transform:uppercase}
</style>
</head>
<body>

<div id="boot">
  <div class="boot-logo">NexusOS</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-text">Loading desktop environment</div>
</div>

<div id="desktop">
  <div id="desktopIcons"></div>
  <div id="windowsLayer"></div>
</div>

<div id="taskbar">
  <button class="tb-btn launcher" id="launcherBtn" title="Launcher">⊞</button>
  <div id="taskItems"></div>
  <div class="tb-divider"></div>
  <button class="tb-btn" id="qsBtn" title="Quick Settings">⚙</button>
  <button class="tray-btn" id="clockBtn">
    <span id="clock">
      <span class="time" id="clockTime">00:00</span>
      <span class="date" id="clockDate">—</span>
    </span>
  </button>
</div>

<div id="launcher">
  <input type="text" id="launcherSearch" placeholder="Cari aplikasi..." autocomplete="off">
  <div id="appGrid"></div>
</div>

<div id="quickSettings">
  <div class="qs-title">Quick Settings</div>
  <div class="qs-grid">
    <button class="qs-tile on" id="qsTheme"><span class="ic">🌙</span><span>Dark Mode</span></button>
    <button class="qs-tile" id="qsWifi"><span class="ic">📶</span><span>Wi-Fi</span></button>
    <button class="qs-tile" id="qsDnd"><span class="ic">🌜</span><span>Do Not Disturb</span></button>
    <button class="qs-tile" id="qsFocus"><span class="ic">🎯</span><span>Focus</span></button>
  </div>
  <div class="qs-title">Brightness</div>
  <input type="range" class="slider" id="qsBright" min="30" max="100" value="100" style="margin-bottom:16px">
  <div class="qs-title">Accent Color</div>
  <div class="color-dots" id="accentDots" style="margin-bottom:16px"></div>
  <div class="qs-title">Wallpaper</div>
  <div class="wallpaper-strip" id="wallpaperStrip"></div>
</div>

<div id="cmdPalette">
  <div id="cmdBox">
    <input type="text" id="cmdInput" placeholder="Ketik perintah atau nama aplikasi..." autocomplete="off">
    <div id="cmdResults"></div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
/* ==========================================================
   NexusOS — Web Desktop Environment
   ========================================================== */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ===== STATE ===== */
const State = {
  windows: new Map(),
  zTop: 100,
  focused: null,
  nextId: 1,
  theme: 'dark',
  accent: '#7c6cff',
  wallpaper: 0,
  brightness: 100
};

/* ===== WALLPAPERS ===== */
const WALLPAPERS = [
  'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80',
  'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80',
  'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=1920&q=80',
  'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1920&q=80',
  'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=1920&q=80',
  'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920&q=80',
  'https://images.unsplash.com/photo-1502134249126-9f3755a50d78?w=1920&q=80',
  'https://images.unsplash.com/photo-1435224668334-0f82ec57b605?w=1920&q=80'
];

const ACCENTS = ['#7c6cff','#ff6b9d','#4ade80','#fbbf24','#f87171','#22d3ee','#a78bfa','#fb923c'];

/* ===== APPS REGISTRY ===== */
const Apps = {
  files: { name:'Files', icon:'📁', color:'linear-gradient(135deg,#f59e0b,#fbbf24)', render:renderFiles, w:520, h:420 },
  terminal: { name:'Terminal', icon:'⌨', color:'linear-gradient(135deg,#1e1e2e,#2d2d44)', render:renderTerminal, w:600, h:400 },
  notes: { name:'Notes', icon:'📝', color:'linear-gradient(135deg,#fbbf24,#f59e0b)', render:renderNotes, w:520, h:480 },
  calculator: { name:'Calculator', icon:'🧮', color:'linear-gradient(135deg,#8b5cf6,#a78bfa)', render:renderCalculator, w:340, h:480 },
  music: { name:'Music', icon:'🎵', color:'linear-gradient(135deg,#ec4899,#f472b6)', render:renderMusic, w:380, h:520 },
  settings: { name:'Settings', icon:'⚙', color:'linear-gradient(135deg,#71717a,#a1a1aa)', render:renderSettings, w:480, h:520 },
  about: { name:'About', icon:'✨', color:'linear-gradient(135deg,#7c6cff,#a89bff)', render:renderAbout, w:420, h:380 }
};

/* ===== MOCK FILE SYSTEM ===== */
const FS = {
  '/': [
    { name:'Documents', type:'folder', size:null },
    { name:'Pictures', type:'folder', size:null },
    { name:'Music', type:'folder', size:null },
    { name:'Projects', type:'folder', size:null },
    { name:'readme.md', type:'file', size:'2.1 KB', content:'# NexusOS\n\nSelamat datang di desktop environment berbasis web.\n\n- Drag titlebar untuk pindah window\n- Klik pojok kanan bawah untuk resize\n- ⌘K / Ctrl+K untuk command palette\n- Klik kanan untuk konteks menu' },
    { name:'about.txt', type:'file', size:'1.2 KB', content:'NexusOS v1.0\nDibuat dengan HTML, CSS, dan JavaScript murni.\nTanpa framework. Tanpa dependency.' },
    { name:'config.json', type:'file', size:'340 B', content:'{\n  "version": "1.0.0",\n  "theme": "dark",\n  "accent": "#7c6cff"\n}' }
  ]
};

/* ===== UTILS ===== */
function toast(msg, icon='✨'){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  $('#toastContainer').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, 2600);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function applyTheme(){
  document.body.classList.toggle('light', State.theme === 'light');
}

function applyAccent(){
  document.documentElement.style.setProperty('--accent', State.accent);
  document.documentElement.style.setProperty('--accent-glow', State.accent + '66');
  $$('.color-dot').forEach(d => d.classList.toggle('active', d.dataset.color === State.accent));
}

function applyWallpaper(){
  $('#desktop').style.backgroundImage = `linear-gradient(rgba(0,0,0,${State.theme==='light'?0.05:0.25}),rgba(0,0,0,${State.theme==='light'?0.1:0.4})), url("${WALLPAPERS[State.wallpaper]}")`;
}

function applyBrightness(){
  $('#desktop').style.filter = `brightness(${State.brightness/100})`;
}

/* ==========================================================
   WINDOW MANAGER
   ========================================================== */
function openApp(id){
  const app = Apps[id];
  if(!app) return;
  // Focus existing window if already open
  for(const [wid, w] of State.windows){
    if(w.appId === id){
      if(w.minimized) toggleMinimize(wid);
      focusWindow(wid);
      return;
    }
  }
  createWindow(id, app);
  closeLauncher();
}

function createWindow(appId, app){
  const id = State.nextId++;
  const W = Math.min(app.w, window.innerWidth - 40);
  const H = Math.min(app.h, window.innerHeight - 140);
  const maxX = window.innerWidth - W - 20;
  const maxY = window.innerHeight - H - 100;
  const x = Math.max(20, Math.min(maxX, (window.innerWidth - W)/2 + (Math.random()-0.5)*80));
  const y = Math.max(20, Math.min(maxY, (window.innerHeight - H)/2 - 40 + (Math.random()-0.5)*60));

  const win = document.createElement('div');
  win.className = 'win focused';
  win.dataset.id = id;
  win.style.cssText = `left:${x}px;top:${y}px;width:${W}px;height:${H}px;z-index:${++State.zTop}`;

  win.innerHTML = `
    <div class="titlebar">
      <div class="win-controls">
        <button class="wc close" title="Close"></button>
        <button class="wc min" title="Minimize"></button>
        <button class="wc max" title="Maximize"></button>
      </div>
      <div class="ttl">${app.icon} ${app.name}</div>
    </div>
    <div class="win-body"></div>
    <div class="resize-handle"></div>
  `;

  $('#windowsLayer').appendChild(win);

  const body = win.querySelector('.win-body');
  app.render(body, id);

  const w = {
    id, appId, el: win,
    x, y, w: W, h: H,
    minimized: false, maximized: false,
    prev: null
  };
  State.windows.set(id, w);

  // Controls
  win.querySelector('.wc.close').addEventListener('click', e => { e.stopPropagation(); closeWindow(id); });
  win.querySelector('.wc.min').addEventListener('click', e => { e.stopPropagation(); toggleMinimize(id); });
  win.querySelector('.wc.max').addEventListener('click', e => { e.stopPropagation(); toggleMaximize(id); });

  // Focus on click
  win.addEventListener('pointerdown', () => focusWindow(id));

  // Drag
  makeDraggable(win, win.querySelector('.titlebar'), id);
  // Resize
  makeResizable(win, win.querySelector('.resize-handle'), id);

  focusWindow(id);
  renderTaskbar();
  return id;
}

function closeWindow(id){
  const w = State.windows.get(id);
  if(!w) return;
  w.el.style.opacity = '0';
  w.el.style.transform = 'scale(.92) translateY(10px)';
  setTimeout(() => {
    w.el.remove();
    State.windows.delete(id);
    if(State.focused === id) State.focused = null;
    renderTaskbar();
  }, 180);
}

function toggleMinimize(id){
  const w = State.windows.get(id);
  if(!w) return;
  w.minimized = !w.minimized;
  w.el.classList.toggle('minimized', w.minimized);
  if(w.minimized && State.focused === id) State.focused = null;
  else if(!w.minimized) focusWindow(id);
  renderTaskbar();
}

function toggleMaximize(id){
  const w = State.windows.get(id);
  if(!w) return;
  if(w.maximized){
    const p = w.prev;
    Object.assign(w.el.style, { left: p.x+'px', top: p.y+'px', width: p.w+'px', height: p.h+'px' });
    w.maximized = false;
    w.el.classList.remove('maximized');
  } else {
    w.prev = { x: w.x, y: w.y, w: w.w, h: w.h };
    Object.assign(w.el.style, { left: '0px', top: '0px', width: '100vw', height: `calc(100vh - ${getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')} - 14px)` });
    w.maximized = true;
    w.el.classList.add('maximized');
  }
}

function focusWindow(id){
  if(State.focused === id) return;
  State.windows.forEach(w => w.el.classList.remove('focused'));
  const w = State.windows.get(id);
  if(!w) return;
  w.el.classList.add('focused');
  w.el.style.zIndex = ++State.zTop;
  State.focused = id;
  renderTaskbar();
}

function makeDraggable(win, handle, id){
  let startX, startY, startL, startT, dragging = false;

  handle.addEventListener('pointerdown', e => {
    if(e.target.closest('.wc')) return;
    const w = State.windows.get(id);
    if(w.maximized) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startL = parseInt(win.style.left) || 0;
    startT = parseInt(win.style.top) || 0;
    handle.setPointerCapture(e.pointerId);
    win.style.transition = 'none';
  });

  handle.addEventListener('pointermove', e => {
    if(!dragging) return;
    const w = State.windows.get(id);
    let nx = startL + (e.clientX - startX);
    let ny = startT + (e.clientY - startY);
    // Clamp to viewport
    nx = Math.max(-w.w + 100, Math.min(window.innerWidth - 100, nx));
    ny = Math.max(0, Math.min(window.innerHeight - 60, ny));
    win.style.left = nx + 'px';
    win.style.top = ny + 'px';
    w.x = nx; w.y = ny;
  });

  handle.addEventListener('pointerup', e => {
    dragging = false;
    handle.releasePointerCapture(e.pointerId);
    win.style.transition = '';
  });
}

function makeResizable(win, handle, id){
  let startX, startY, startW, startH, resizing = false;

  handle.addEventListener('pointerdown', e => {
    e.stopPropagation();
    const w = State.windows.get(id);
    if(w.maximized) return;
    resizing = true;
    startX = e.clientX; startY = e.clientY;
    startW = w.w; startH = w.h;
    handle.setPointerCapture(e.pointerId);
  });

  handle.addEventListener('pointermove', e => {
    if(!resizing) return;
    const w = State.windows.get(id);
    const nw = Math.max(280, startW + (e.clientX - startX));
    const nh = Math.max(180, startH + (e.clientY - startY));
    win.style.width = nw + 'px';
    win.style.height = nh + 'px';
    w.w = nw; w.h = nh;
  });

  handle.addEventListener('pointerup', e => {
    resizing = false;
    handle.releasePointerCapture(e.pointerId);
  });
}

/* ===== TASKBAR ===== */
function renderTaskbar(){
  const container = $('#taskItems');
  const items = [];
  State.windows.forEach((w, id) => {
    const app = Apps[w.appId];
    items.push(`
      <button class="task-item ${State.focused===id?'focused':''}" data-wid="${id}">
        <span class="ti-icon">${app.icon}</span>
        <span class="ti-name">${app.name}</span>
      </button>
    `);
  });
  container.innerHTML = items.join('');
  container.querySelectorAll('.task-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.wid);
      const w = State.windows.get(id);
      if(!w) return;
      if(w.minimized) toggleMinimize(id);
      else if(State.focused === id) toggleMinimize(id);
      else focusWindow(id);
    });
  });
}

/* ===== DESKTOP ICONS ===== */
function renderDesktopIcons(){
  const container = $('#desktopIcons');
  const pinned = ['files','terminal','notes','music'];
  container.innerHTML = pinned.map(id => {
    const app = Apps[id];
    return `
      <div class="d-icon" data-app="${id}">
        <div class="ic" style="background:${app.color}">${app.icon}</div>
        <div class="lbl">${app.name}</div>
      </div>
    `;
  }).join('');
  container.querySelectorAll('.d-icon').forEach(el => {
    el.addEventListener('dblclick', () => openApp(el.dataset.app));
    el.addEventListener('click', (e) => {
      // Single tap on touch: brief delay
      if(e.pointerType === 'touch') openApp(el.dataset.app);
    });
  });
}

/* ===== LAUNCHER ===== */
function openLauncher(){
  $('#launcher').classList.add('show');
  $('#launcherSearch').value = '';
  renderAppGrid('');
  setTimeout(() => $('#launcherSearch').focus(), 100);
}
function closeLauncher(){
  $('#launcher').classList.remove('show');
}
function renderAppGrid(query){
  const q = query.toLowerCase();
  const filtered = Object.entries(Apps).filter(([id, app]) =>
    app.name.toLowerCase().includes(q)
  );
  $('#appGrid').innerHTML = filtered.map(([id, app]) => `
    <button class="app-tile" data-app="${id}">
      <div class="ic" style="background:${app.color}">${app.icon}</div>
      <div class="nm">${app.name}</div>
    </button>
  `).join('');
  $('#appGrid').querySelectorAll('.app-tile').forEach(el => {
    el.addEventListener('click', () => openApp(el.dataset.app));
  });
}

/* ==========================================================
   APP RENDERERS
   ========================================================== */

/* --- FILES --- */
function renderFiles(body, id){
  let cwd = '/';
  function draw(){
    const items = FS[cwd] || FS['/'];
    body.innerHTML = `
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px;font-family:ui-monospace,monospace">${cwd}</div>
      <div class="file-list">
        ${items.map((f, i) => `
          <div class="file-item" data-idx="${i}">
            <span class="fi-ic">${f.type==='folder'?'📁':'📄'}</span>
            <span class="fi-name">${escapeHtml(f.name)}</span>
            <span class="fi-size">${f.size || ''}</span>
          </div>
        `).join('')}
      </div>
    `;
    body.querySelectorAll('.file-item').forEach(el => {
      el.addEventListener('dblclick', () => {
        const f = items[parseInt(el.dataset.idx)];
        if(f.type === 'folder'){
          cwd = '/' + f.name;
          FS[cwd] = FS[cwd] || [
            { name: `${f.name}_file_1.txt`, type:'file', size:'1.1 KB', content:`Isi dari ${f.name}_file_1.txt` },
            { name: `${f.name}_notes.md`, type:'file', size:'890 B', content:`Catatan untuk ${f.name}` }
          ];
          draw();
        } else {
          toast(`Membuka ${f.name}`, '📄');
          if(f.content) showFilePreview(f);
        }
      });
      el.addEventListener('click', () => {
        if(window.innerWidth < 700) {
          const f = items[parseInt(el.dataset.idx)];
          if(f.type === 'folder'){
            cwd = '/' + f.name;
            FS[cwd] = FS[cwd] || [
              { name: `${f.name}_file_1.txt`, type:'file', size:'1.1 KB', content:`Isi dari ${f.name}_file_1.txt` },
              { name: `${f.name}_notes.md`, type:'file', size:'890 B', content:`Catatan untuk ${f.name}` }
            ];
            draw();
          } else if(f.content) showFilePreview(f);
        }
      });
    });
  }
  function showFilePreview(f){
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-weight:600;font-size:14px">${escapeHtml(f.name)}</div>
        <button class="btn-back" style="background:rgba(255,255,255,.08);border:none;color:inherit;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:11px">← Back</button>
      </div>
      <pre style="white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.65;color:var(--text)">${escapeHtml(f.content)}</pre>
    `;
    body.querySelector('.btn-back').addEventListener('click', draw);
  }
  draw();
}

/* --- TERMINAL --- */
function renderTerminal(body, id){
  body.classList.add('terminal');
  body.innerHTML = `
    <div class="term-output" id="term-out-${id}"></div>
    <div class="term-row">
      <span class="prompt">nexus@os</span>
      <span class="path">~</span>
      <span>$</span>
      <input class="terminal-input" id="term-in-${id}" autocomplete="off" spellcheck="false">
    </div>
  `;
  const out = body.querySelector(`#term-out-${id}`);
  const inp = body.querySelector(`#term-in-${id}`);

  const write = (html) => {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = html;
    out.appendChild(div);
    body.scrollTop = body.scrollHeight;
  };

  write(`<span class="ok">NexusOS Terminal v1.0</span> — ketik <span class="warn">help</span> untuk daftar perintah`);
  write('');

  const cmds = {
    help: () => `Perintah tersedia:\n  help              Tampilkan bantuan\n  ls                Daftar file di direktori ini\n  cat <file>        Tampilkan isi file\n  echo <text>       Tampilkan teks\n  date              Tanggal & waktu sekarang\n  whoami            Info pengguna\n  neofetch          Info sistem\n  theme <d/l>       Ganti tema (dark/light)\n  open <app>        Buka aplikasi\n  clear             Bersihkan layar`,
    ls: () => (FS['/'] || []).map(f => f.type==='folder' ? `<span style="color:#4ec9b0">${f.name}/</span>` : f.name).join('  '),
    cat: (args) => {
      if(!args[0]) return `<span class="err">cat: butuh nama file</span>`;
      const f = (FS['/']||[]).find(x => x.name === args[0] && x.type === 'file');
      if(!f) return `<span class="err">cat: ${args[0]}: file tidak ditemukan</span>`;
      return escapeHtml(f.content || '');
    },
    echo: (args) => args.join(' '),
    date: () => new Date().toString(),
    whoami: () => 'nexus@os (guest)',
    neofetch: () => `
<span style="color:#7c6cff;font-weight:600">    ╔══════════╗ </span>  <span style="color:#7c6cff;font-weight:600">nexus@os</span>
<span style="color:#7c6cff">    ║  NEXUS   ║ </span>  ─────────
<span style="color:#7c6cff">    ║   OS     ║ </span>  OS: NexusOS 1.0
<span style="color:#7c6cff">    ╚══════════╝ </span>  Kernel: Web 2026
                       Shell: nexus-sh
                       WM: NexusWM
                       Theme: ${State.theme}
                       Apps: ${Object.keys(Apps).length}`,
    theme: (args) => {
      if(args[0]==='l' || args[0]==='light'){ setTheme('light'); return '<span class="ok">Tema diubah ke light</span>'; }
      if(args[0]==='d' || args[0]==='dark'){ setTheme('dark'); return '<span class="ok">Tema diubah ke dark</span>'; }
      return `<span class="err">theme: gunakan "theme d" atau "theme l"</span>`;
    },
    open: (args) => {
      const a = args[0];
      if(Apps[a]){ openApp(a); return `<span class="ok">Membuka ${Apps[a].name}...</span>`; }
      return `<span class="err">open: aplikasi "${a}" tidak ditemukan</span>`;
    },
    clear: () => { out.innerHTML = ''; return null; }
  };

  const history = [];
  let histIdx = -1;

  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const val = inp.value.trim();
      inp.value = '';
      if(!val) { write(`<span class="prompt">nexus@os</span> <span class="path">~</span> $`); return; }
      history.push(val); histIdx = history.length;
      write(`<span class="prompt">nexus@os</span> <span class="path">~</span> $ ${escapeHtml(val)}`);
      const [cmd, ...args] = val.split(/\s+/);
      const fn = cmds[cmd.toLowerCase()];
      if(fn){
        const res = fn(args);
        if(res) res.split('\n').forEach(l => write(l));
      } else {
        write(`<span class="err">nexus-sh: command not found: ${escapeHtml(cmd)}</span>`);
      }
      write('');
    } else if(e.key === 'ArrowUp'){
      if(histIdx > 0){ histIdx--; inp.value = history[histIdx]; e.preventDefault(); }
    } else if(e.key === 'ArrowDown'){
      if(histIdx < history.length - 1){ histIdx++; inp.value = history[histIdx]; }
      else { histIdx = history.length; inp.value = ''; }
      e.preventDefault();
    }
  });

  setTimeout(() => inp.focus(), 100);
  body.addEventListener('click', (e) => {
    if(!e.target.closest('input, button, a')) inp.focus();
  });
}

/* --- NOTES --- */
function renderNotes(body, id){
  const saved = localStorage.getItem('nexus-notes') || '';
  body.innerHTML = `
    <div class="note-meta">
      <span id="noteSaved">Tersimpan otomatis</span>
    </div>
    <textarea class="note-area" id="noteArea" placeholder="Mulai menulis...">${escapeHtml(saved)}</textarea>
  `;
  const ta = body.querySelector('#noteArea');
  const meta = body.querySelector('#noteSaved');
  let timer;
  ta.addEventListener('input', () => {
    clearTimeout(timer);
    meta.textContent = 'Mengetik...';
    timer = setTimeout(() => {
      localStorage.setItem('nexus-notes', ta.value);
      meta.textContent = `Tersimpan ${new Date().toLocaleTimeString('id-ID')}`;
    }, 400);
  });

/* --- CALCULATOR --- */
function renderCalculator(body, id){
  body.innerHTML = `
    <div class="calc-display">
      <div class="expr" id="calcExpr"></div>
      <div class="val" id="calcVal">0</div>
    </div>
    <div class="calc-grid">
      <button class="calc-btn op" data-v="C">C</button>
      <button class="calc-btn op" data-v="±">±</button>
      <button class="calc-btn op" data-v="%">%</button>
      <button class="calc-btn op" data-v="÷">÷</button>
      <button class="calc-btn" data-v="7">7</button>
      <button class="calc-btn" data-v="8">8</button>
      <button class="calc-btn" data-v="9">9</button>
      <button class="calc-btn op" data-v="×">×</button>
      <button class="calc-btn" data-v="4">4</button>
      <button class="calc-btn" data-v="5">5</button>
      <button class="calc-btn" data-v="6">6</button>
      <button class="calc-btn op" data-v="-">−</button>
      <button class="calc-btn" data-v="1">1</button>
      <button class="calc-btn" data-v="2">2</button>
      <button class="calc-btn" data-v="3">3</button>
      <button class="calc-btn op" data-v="+">+</button>
      <button class="calc-btn" data-v="0" style="grid-column:span 2">0</button>
      <button class="calc-btn" data-v=".">.</button>
      <button class="calc-btn eq" data-v="=">=</button>
    </div>
  `;
  let current = '0', prev = null, op = null, fresh = false;
  const val = body.querySelector('#calcVal');
  const expr = body.querySelector('#calcExpr');

  function update(){
    val.textContent = current;
    expr.textContent = prev !== null && op ? `${prev} ${op}` : '';
  }

  function calc(){
    const a = parseFloat(prev), b = parseFloat(current);
    switch(op){
      case '+': return a + b;
      case '-': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? 'Error' : a / b;
      case '%': return a % b;
    }
    return b;
  }

  body.querySelectorAll('.calc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.v;
      if(v === 'C'){ current='0'; prev=null; op=null; fresh=false; }
      else if(v === '±'){ current = current.startsWith('-') ? current.slice(1) : '-' + current; }
      else if(v === '%' || v === '÷' || v === '×' || v === '-' || v === '+'){
        if(op && !fresh){ current = String(calc()); }
        prev = current; op = v; fresh = true;
      }
      else if(v === '='){
        if(op){ current = String(calc()); prev = null; op = null; }
      }
      else if(v === '.'){
        if(fresh){ current = '0.'; fresh = false; }
        else if(!current.includes('.')) current += '.';
      }
      else {
        if(fresh || current === '0'){ current = v; fresh = false; }
        else current += v;
      }
      update();
    });
  });
  update();
}

/* --- MUSIC --- */
function renderMusic(body, id){
  body.innerHTML = `
    <div class="music-player">
      <div class="music-cover">🎵</div>
      <div class="music-title">Midnight Drive</div>
      <div class="music-artist">Nexus Collective</div>
      <div class="music-progress"><div class="music-bar"></div></div>
      <div class="music-time"><span class="cur">0:00</span><span class="dur">3:42</span></div>
      <div class="music-ctrl">
        <button class="music-btn" data-c="prev">⏮</button>
        <button class="music-btn play" data-c="play">▶</button>
        <button class="music-btn" data-c="next">⏭</button>
      </div>
    </div>
  `;
  let playing = false, time = 0;
  const dur = 222;
  const bar = body.querySelector('.music-bar');
  const cur = body.querySelector('.cur');
  const btn = body.querySelector('[data-c="play"]');
  const player = body.querySelector('.music-player');

  function fmt(s){ return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }

  setInterval(() => {
    if(playing){
      time = (time + 0.25) % dur;
      bar.style.width = (time/dur*100) + '%';
      cur.textContent = fmt(time);
    }
  }, 250);

  btn.addEventListener('click', () => {
    playing = !playing;
    btn.textContent = playing ? '⏸' : '▶';
    player.classList.toggle('playing', playing);
  });
  body.querySelector('[data-c="prev"]').addEventListener('click', () => { time = 0; bar.style.width='0%'; cur.textContent='0:00'; });
  body.querySelector('[data-c="next"]').addEventListener('click', () => { time = 0; bar.style.width='0%'; cur.textContent='0:00'; });
}

/* ==========================================================
   COMMAND PALETTE
   ========================================================== */
const Commands = [
  ...Object.entries(Apps).map(([id, app]) => ({
    id: 'app-' + id,
    title: 'Open ' + app.name,
    icon: app.icon,
    action: () => openApp(id)
  })),
  { id:'toggle-theme', title:'Toggle Dark/Light Mode', icon:'🌓', kbd:'⌘T', action: () => setTheme(State.theme==='dark'?'light':'dark') },
  { id:'next-wallpaper', title:'Next Wallpaper', icon:'🖼', action: () => { State.wallpaper = (State.wallpaper+1)%WALLPAPERS.length; applyWallpaper(); } },
  { id:'close-all', title:'Close All Windows', icon:'✕', action: () => { [...State.windows.keys()].forEach(closeWindow); } },
  { id:'reset-notes', title:'Reset Notes', icon:'🗑', action: () => { localStorage.removeItem('nexus-notes'); toast('Notes direset','🗑'); } }
];

function openCmdPalette(){
  $('#cmdPalette').classList.add('show');
  $('#cmdInput').value = '';
  renderCmdResults('');
  setTimeout(() => $('#cmdInput').focus(), 100);
}
function closeCmdPalette(){ $('#cmdPalette').classList.remove('show'); }

function renderCmdResults(query){
  const q = query.toLowerCase();
  const filtered = Commands.filter(c => c.title.toLowerCase().includes(q));
  const container = $('#cmdResults');
  if(!filtered.length){ container.innerHTML = ''; return; }
  container.innerHTML = filtered.map((c, i) => `
    <div class="cmd-item ${i===0?'sel':''}" data-idx="${i}">
      <span class="ci-ic">${c.icon}</span>
      <span>${c.title}</span>
      ${c.kbd ? `<span class="ci-kbd">${c.kbd}</span>` : ''}
    </div>
  `).join('');
  container.querySelectorAll('.cmd-item').forEach((el, i) => {
    el.addEventListener('click', () => { filtered[i].action(); closeCmdPalette(); });
    el.addEventListener('mouseenter', () => {
      container.querySelectorAll('.cmd-item').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
    });
  });
  container._filtered = filtered;
}

/* ==========================================================
   SETTINGS SYNC
   ========================================================== */
function setTheme(t){
  State.theme = t;
  applyTheme();
  applyWallpaper();
  syncQuickSettings();
}

function syncQuickSettings(){
  $('#qsTheme').classList.toggle('on', State.theme === 'dark');
  // Update wallpapers thumbs
  $('#wallpaperStrip').innerHTML = WALLPAPERS.map((w, i) => `
    <div class="wp-thumb ${i===State.wallpaper?'active':''}" style="background-image:url('${w}')" data-wp="${i}"></div>
  `).join('');
  $('#wallpaperStrip').querySelectorAll('.wp-thumb').forEach(t => {
    t.addEventListener('click', () => {
      State.wallpaper = parseInt(t.dataset.wp);
      applyWallpaper();
      syncQuickSettings();
    });
  });
  // Accent dots
  $('#accentDots').innerHTML = ACCENTS.map(c => `
    <div class="color-dot ${c===State.accent?'active':''}" style="background:${c}" data-color="${c}"></div>
  `).join('');
  $('#accentDots').querySelectorAll('.color-dot').forEach(d => {
    d.addEventListener('click', () => {
      State.accent = d.dataset.color;
      applyAccent();
      syncQuickSettings();
    });
  });
}

/* ==========================================================
   CLOCK
   ========================================================== */
function tickClock(){
  const now = new Date();
  const days = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  $('#clockTime').textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  $('#clockDate').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
}

/* ==========================================================
   EVENT BINDINGS
   ========================================================== */
// Launcher
$('#launcherBtn').addEventListener('click', () => {
  if($('#launcher').classList.contains('show')) closeLauncher();
  else openLauncher();
});
$('#launcherSearch').addEventListener('input', e => renderAppGrid(e.target.value));
$('#launcher').addEventListener('click', e => { if(e.target.id === 'launcher') closeLauncher(); });

// Quick Settings
$('#qsBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('#quickSettings').classList.toggle('show');
});
document.addEventListener('click', e => {
  if(!e.target.closest('#quickSettings') && !e.target.closest('#qsBtn')) $('#quickSettings').classList.remove('show');
});
$('#qsTheme').addEventListener('click', () => setTheme(State.theme==='dark'?'light':'dark'));
$('#qsWifi').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
$('#qsDnd').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
$('#qsFocus').addEventListener('click', e => e.currentTarget.classList.toggle('on'));
$('#qsBright').addEventListener('input', e => { State.brightness = +e.target.value; applyBrightness(); });

// Clock button — open launcher as calendar-ish
$('#clockBtn').addEventListener('click', () => toast(new Date().toLocaleString('id-ID'), '📅'));

// Command palette
document.addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'k'){
    e.preventDefault();
    if($('#cmdPalette').classList.contains('show')) closeCmdPalette();
    else openCmdPalette();
  }
  if(e.key === 'Escape'){
    closeCmdPalette();
    closeLauncher();
    $('#quickSettings').classList.remove('show');
  }
});
$('#cmdPalette').addEventListener('click', e => { if(e.target.id === 'cmdPalette') closeCmdPalette(); });
$('#cmdInput').addEventListener('input', e => renderCmdResults(e.target.value));
$('#cmdInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const filtered = $('#cmdResults')._filtered || [];
    const sel = $('#cmdResults').querySelector('.cmd-item.sel');
    const idx = sel ? parseInt(sel.dataset.idx) : 0;
    if(filtered[idx]){ filtered[idx].action(); closeCmdPalette(); }
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    const items = [...$('#cmdResults').querySelectorAll('.cmd-item')];
    if(!items.length) return;
    const cur = items.findIndex(i => i.classList.contains('sel'));
    const next = e.key === 'ArrowDown' ? (cur+1)%items.length : (cur-1+items.length)%items.length;
    items.forEach(i => i.classList.remove('sel'));
    items[next].classList.add('sel');
    items[next].scrollIntoView({ block:'nearest' });
  }
});

// Right-click on desktop to open launcher
document.addEventListener('contextmenu', e => {
  if(e.target.closest('.win')) return;
  e.preventDefault();
  openLauncher();
});

// Resize listener to keep windows in view
window.addEventListener('resize', () => {
  State.windows.forEach(w => {
    if(w.maximized) return;
    const maxX = window.innerWidth - 100;
    const maxY = window.innerHeight - 60;
    if(parseInt(w.el.style.left) > maxX) w.el.style.left = maxX + 'px';
    if(parseInt(w.el.style.top) > maxY) w.el.style.top = maxY + 'px';
  });
});

/* ==========================================================
   BOOT
   ========================================================== */
(function init(){
  applyTheme();
  applyAccent();
  applyWallpaper();
  renderDesktopIcons();
  renderTaskbar();
  syncQuickSettings();
  tickClock();
  setInterval(tickClock, 1000);

  setTimeout(() => {
    $('#boot').classList.add('hide');
    setTimeout(() => {
      toast('Selamat datang di NexusOS', '✨');
      // Auto-open a welcome window
      setTimeout(() => openApp('about'), 400);
    }, 300);
  }, 1700);
})();
</script>
