<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Windows Command Prompt — NexusOS Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0c0c0c}
body{
  display:flex;align-items:center;justify-content:center;
  font-family:Consolas,'Lucida Console','Courier New',monospace;
  padding:20px;
}
#cmdWin{
  width:min(920px,100%);
  height:min(600px,100%);
  background:#0c0c0c;
  border:1px solid #2a2a2a;
  border-radius:8px;
  display:flex;flex-direction:column;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05);
  overflow:hidden;
}
#titlebar{
  height:32px;flex-shrink:0;
  background:#1f1f1f;
  display:flex;align-items:center;
  padding:0 12px;gap:8px;
  border-bottom:1px solid #000;
  user-select:none;
}
.tb-icon{
  width:16px;height:16px;
  background:linear-gradient(135deg,#0078d4,#005a9e);
  border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;font-weight:700;
}
.tb-title{
  flex:1;font-size:11.5px;color:#ddd;
  font-family:'Segoe UI',sans-serif;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-ctrl{display:flex;gap:0}
.tb-btn{
  width:44px;height:32px;
  background:transparent;border:none;
  color:#ddd;font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.tb-btn:hover{background:#333}
.tb-btn.close:hover{background:#e81123;color:#fff}

#screen{
  flex:1;
  padding:8px 12px;
  overflow-y:auto;
  overflow-x:hidden;
  font-size:14px;
  line-height:1.35;
  color:#cccccc;
  background:#0c0c0c;
  scrollbar-width:thin;
  scrollbar-color:#333 #0c0c0c;
  white-space:pre-wrap;
  word-break:break-word;
  cursor:text;
}
#screen::-webkit-scrollbar{width:10px}
#screen::-webkit-scrollbar-track{background:#0c0c0c}
#screen::-webkit-scrollbar-thumb{background:#333;border-radius:2px;border:2px solid #0c0c0c}
#screen::-webkit-scrollbar-thumb:hover{background:#444}

.line{white-space:pre-wrap;word-break:break-word;min-height:18px}
.err{color:#ff5c5c}
.ok{color:#5cff7a}
.warn{color:#ffd75c}
.info{color:#5ccfff}
.dim{color:#888}
.hdr{color:#fff}
#inputLine{display:flex;flex-wrap:wrap;align-items:baseline}
#promptTxt{white-space:pre}
#cmdInput{
  flex:1;min-width:100px;
  background:transparent;border:none;
  outline:none;color:inherit;
  font:inherit;padding:0;margin:0;
  caret-color:#ccc;
}
::selection{background:#264f78;color:#fff}

@media(max-width:640px){
  body{padding:0}
  #cmdWin{border-radius:0;border:none;width:100vw;height:100vh;max-width:100%;max-height:100%}
  #screen{font-size:12.5px;padding:6px 8px}
}
</style>
</head>
<body>

<div id="cmdWin">
  <div id="titlebar">
    <div class="tb-icon">C:\</div>
    <div class="tb-title" id="winTitle">Command Prompt</div>
    <div class="tb-ctrl">
      <button class="tb-btn" title="Minimize">─</button>
      <button class="tb-btn" title="Maximize">□</button>
      <button class="tb-btn close" title="Close" onclick="if(window.__cmd)window.__cmd.exit()">✕</button>
    </div>
  </div>
  <div id="screen" tabindex="0">
    <div id="output"></div>
    <div id="inputLine">
      <span id="promptTxt"></span>
      <input id="cmdInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
  </div>
</div>

<script>
/* ============================================================
   Windows Command Prompt Emulator
   ============================================================ */

function makeFS() {

                    'readme.txt': { type: 'file', size: 178, content: 'Selamat datang di Windows CMD emulator!\n\nKetik HELP untuk daftar perintah.\nKetik DIR untuk lihat isi folder.' }
                  }

                  }
                },

                  }
                },
                'Pictures': { type: 'dir', children: {} },

              }
            }
          }
        },
        'Program Files': {
          type: 'dir',
          children: {
            'NexusOS': {
              type: 'dir',
              children: {
                'nexus.exe': { type: 'file', size: 1048576, content: '' },
                'readme.txt': { type: 'file', size: 512, content: 'NexusOS v1.0\nInstalled at C:\\Program Files\\NexusOS\n\nRun nexus.exe to start.' }
              }
            }
          }
        },
        'temp': { type: 'dir', children: {} },
        'autoexec.bat': { type: 'file', size: 78, content: '@echo off\necho Welcome to NexusOS\npause' },
        'config.sys': { type: 'file', size: 0, content: '' }

}

/* ============================================================
   Path utilities
   ============================================================ */
function splitPath(p) {
  return p.split('\\').filter(s => s.length > 0);
}
function joinPath(parts) {
  if (!parts.length) return '';
  return parts.join('\\');
}
function normalizePath(input, cwd) {
  input = (input || '').replace(/\//g, '\\').trim();
  if (!input) return cwd;
  let full;
  // Absolute with drive: C:\...
  if (/^[A-Za-z]:/.test(input)) {
    full = input;
  } else if (input.startsWith('\\')) {
    // Absolute from drive root
    const drive = cwd.substring(0, 2);
    full = drive + input;
  } else {
    full = cwd + '\\' + input;
  }
  // Extract drive
  const drive = full.substring(0, 2).toUpperCase();
  let rest = full.substring(2).replace(/^\\+/, '');
  const parts = [];
  for (const seg of rest.split('\\')) {
    if (!seg || seg === '.') continue;
    if (seg === '..') { parts.pop(); continue; }
    parts.push(seg);
  }
  return drive + (parts.length ? '\\' + parts.join('\\') : '\\');
}
function parentPath(p) {
  const norm = p.replace(/\\+$/, '');
  const idx = norm.lastIndexOf('\\');
  if (idx <= 2) return norm.substring(0, 2) + '\\';
  return norm.substring(0, idx);
}
function baseName(p) {
  const norm = p.replace(/\\+$/, '');
  const idx = norm.lastIndexOf('\\');
  return norm.substring(idx + 1);
}
function fileExt(name) {
  const i = name.lastIndexOf('.');
  return i > 0 ? name.substring(i) : '';
}
function fmtBytes(b) {
  if (b === 0) return '0';
  return b.toLocaleString('en-US');
}
function fmtDate(d) {
  const pad = n => String(n).padStart(2, '0');
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return pad(d.getMonth()+1) + '/' + pad(d.getDate()) + '/' + d.getFullYear() +
         '  ' + pad(h) + ':' + pad(d.getMinutes()) + ' ' + ampm;
}

/* ============================================================
   WindowsCMD Class
   ============================================================ */
class WindowsCMD {
  constructor(opts = {}) {
    this.outputEl = opts.output || document.getElementById('output');
    this.inputEl  = opts.input  || document.getElementById('cmdInput');
    this.promptEl = opts.promptTxt || document.getElementById('promptTxt');
    this.titleEl  = opts.titleEl || document.getElementById('winTitle');
    this.onExit   = opts.onExit  || (() => {});
    this.onOpenApp = opts.onOpenApp || (() => {});

    this.fs = makeFS();
    this.cwd = 'C:\\Users\\Guest';
    this.env = {
      USERNAME: 'Guest',
      USERPROFILE: 'C:\\Users\\Guest',
      COMPUTERNAME: 'NEXUS-PC',
      OS: 'Windows_NT',
      PATH: 'C:\\Windows\\System32;C:\\Windows',
      TEMP: 'C:\\Users\\Guest\\AppData\\Local\\Temp',
      TMP: 'C:\\Users\\Guest\\AppData\\Local\\Temp',
      SYSTEMROOT: 'C:\\Windows',
      WINDIR: 'C:\\Windows',
      PROMPT: '$P$G',
      CD: this.cwd,
      RANDOM: '0'
    };
    this.history = [];
    this.histIdx = 0;
    this.echoOn = true;
    this.color = { fg: '#cccccc', bg: '#0c0c0c' };
    this.running = true;
    this.waitingFor = null;

    this.commands = this.buildCommands();
    this.bindInput();

    this.writeLine('Microsoft Windows [Version 10.0.22631.3007]');
    this.writeLine('(c) Microsoft Corporation. All rights reserved.');
    this.writeLine('');
    this.updatePrompt();
    setTimeout(() => this.inputEl.focus(), 50);
  }

  /* ---------- Output helpers ---------- */
  write(text, cls) {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text;
    this.outputEl.appendChild(span);
  }
  writeLine(text, cls) {
    this.write(text, cls);
    this.outputEl.appendChild(document.createTextNode('\n'));
    this.scrollBottom();
  }
  writeHTML(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    this.outputEl.appendChild(div);
    this.scrollBottom();
  }
  scrollBottom() {
    const s = document.getElementById('screen');
    if (s) s.scrollTop = s.scrollHeight;
  }
  clear() {
    this.outputEl.innerHTML = '';
    this.scrollBottom();
  }

  /* ---------- Prompt & env var expansion ---------- */
  expandVars(str) {
    if (!str) return '';
    return str.replace(/%([A-Za-z_][A-Za-z0-9_]*)%/g, (m, name) => {
      const key = name.toUpperCase();
      if (key === 'CD') return this.cwd;
      if (key === 'DATE') return new Date().toLocaleDateString('en-US');
      if (key === 'TIME') return new Date().toLocaleTimeString('en-US');
      if (key === 'RANDOM') return String(Math.floor(Math.random() * 32768));
      return this.env[key] !== undefined ? this.env[key] : '%' + name + '%';
    });
  }
  getPromptString() {
    const tmpl = this.env.PROMPT || '$P$G';
    let out = '';
    for (let i = 0; i < tmpl.length; i++) {
      const c = tmpl[i];
      if (c === '$' && i + 1 < tmpl.length) {
        const n = tmpl[++i];
        switch (n) {
          case 'P': out += this.cwd; break;
          case 'G': out += '>'; break;
          case 'L': out += '<'; break;
          case 'N': out += 'C'; break;
          case 'D': out += fmtDate(new Date()).split('  ')[0]; break;
          case 'T': out += fmtDate(new Date()).split('  ')[1]; break;
          case 'B': out += '|'; break;
          case '_': out += ' '; break;
          case '$': out += '$'; break;
          default: out += '$' + n;
        }
      } else {
        out += c;
      }
    }
    return out;
  }
  updatePrompt() {
    this.promptEl.textContent = this.getPromptString();
  }

  /* ---------- FS helpers ---------- */
  getNode(path) {
    const norm = normalizePath(path, this.cwd);
    const parts = splitPath(norm);
    if (!parts.length) return null;
    const drive = parts[0].toUpperCase() + ':';
    let node = this.fs[drive];
    if (!node) return null;
    for (let i = 1; i < parts.length; i++) {
      if (!node.children) return null;
      const key = Object.keys(node.children).find(k => k.toLowerCase() === parts[i].toLowerCase());
      if (!key) return null;
      node = node.children[key];
    }
    return node;
  }
  getParentNode(path) {
    return this.getNode(parentPath(normalizePath(path, this.cwd)));
  }
  getKeyInParent(path) {
    return baseName(normalizePath(path, this.cwd));
  }
  ensureDir(path) {
    const norm = normalizePath(path, this.cwd);
    const parts = splitPath(norm);
    if (!parts.length) return null;
    const drive = parts[0].toUpperCase() + ':';
    if (!this.fs[drive]) this.fs[drive] = { type: 'drive', children: {} };
    let node = this.fs[drive];
    for (let i = 1; i < parts.length; i++) {
      const name = parts[i];
      const key = Object.keys(node.children).find(k => k.toLowerCase() === name.toLowerCase());
      if (key) {
        node = node.children[key];
        if (node.type !== 'dir') return null;
      } else {
        node.children[name] = { type: 'dir', children: {} };
        node = node.children[name];
      }
    }
    return node;
  }

  /* ---------- Command builder ---------- */
  buildCommands() {
    const self = this;
    const C = {};

    /* ----- help ----- */
    C.help = {
      desc: 'Provides Help information for Windows commands.',
      run: () => {
        self.writeLine('For more information on a specific command, type HELP command-name');
        self.writeLine('');
        const names = Object.keys(self.commands).filter(k => self.commands[k].desc).sort();
        const groups = {};
        names.forEach(n => {
          const first = n[0].toUpperCase();
          (groups[first] = groups[first] || []).push(n.toUpperCase());
        });
        Object.keys(groups).sort().forEach(letter => {
          self.writeLine(groups[letter].join('  '));
        });
        self.writeLine('');
      }
    };

    /* ----- cls ----- */
    C.cls = { desc: 'Clears the screen.', run: () => self.clear() };

    /* ----- exit ----- */
    C.exit = {
      desc: 'Quits the CMD.EXE program.',
      run: (args) => {
        if (args.includes('/b')) return 'exit_batch';
        self.writeLine('');
        self.running = false;
        setTimeout(() => self.onExit(), 100);
      }
    };

    /* ----- ver ----- */
    C.ver = { desc: 'Displays the Windows version.', run: () => self.writeLine('\nMicrosoft Windows [Version 10.0.22631.3007]\n') };

    /* ----- echo ----- */
    C.echo = {
      desc: 'Displays messages, or turns command-echoing on or off.',
      run: (args, raw) => {
        if (!args.length) { self.writeLine('ECHO is on.'); return; }
        if (args[0].toLowerCase() === 'off') { self.echoOn = false; return; }
        if (args[0].toLowerCase() === 'on') { self.echoOn = true; return; }
        let text = raw.replace(/^echo\s*/i, '');
        if (text === '.') { self.writeLine(''); return; }
        text = self.expandVars(text);
        self.writeLine(text);
      }
    };

    /* ----- dir ----- */
    C.dir = {
      desc: 'Displays a list of files and subdirectories in a directory.',
      run: (args) => {
        const flags = args.filter(a => a.startsWith('/'));
        const paths = args.filter(a => !a.startsWith('/'));
        const target = paths[0] || self.cwd;
        const bare = flags.some(f => /^\/b$/i.test(f));
        const wide = flags.some(f => /^\/w$/i.test(f));
        const recurse = flags.some(f => /^\/s$/i.test(f));
        const node = self.getNode(target);
        if (!node) { self.writeLine('File Not Found', 'err'); return; }
        if (node.type === 'file') {
          self.printFileLine(baseName(target), node, bare);
          return;
        }
        const norm = normalizePath(target, self.cwd);
        if (!bare) {
          self.writeLine('');
          self.writeLine(' Volume in drive C has no label.');
          self.writeLine(' Volume Serial Number is A1B2-C3D4');
          self.writeLine('');
          self.writeLine(' Directory of ' + norm);
          self.writeLine('');
        }
        const entries = [];
        for (const [name, child] of Object.entries(node.children)) {
          if (child.hidden) continue;
          entries.push({ name, node: child });
        }
        entries.sort((a, b) => {
          if (a.node.type === b.node.type) return a.name.localeCompare(b.name);
          return a.node.type === 'dir' ? -1 : 1;
        });
        let totalBytes = 0, fileCount = 0, dirCount = 0;
        if (wide) {
          const cols = [];
          entries.forEach(e => {
            const nm = e.name;
            if (e.node.type === 'dir') { cols.push(('[' + nm.toUpperCase() + ']').padEnd(14)); dirCount++; }
            else { cols.push(nm.padEnd(14)); fileCount++; totalBytes += e.node.size || 0; }
          });
          for (let i = 0; i < cols.length; i += 5) {
            self.writeLine(cols.slice(i, i + 5).join(''));
          }
        } else if (bare) {
          entries.forEach(e => self.writeLine(e.name));
        } else {
          for (const e of entries) {
            self.writeLine(self.formatDirLine(e.name, e.node));
          }
        }
        if (!bare && !wide) {
          self.writeLine('');
          self.writeLine('               ' + fileCount + ' File(s)  ' + fmtBytes(totalBytes) + ' bytes');
          self.writeLine('               ' + dirCount + ' Dir(s)   45,678,901,234 bytes free');
          self.writeLine('');
        }
      }
    };
    C.directory = C.dir;

    /* ----- cd / chdir ----- */
    C.cd = {
      desc: 'Displays the name of or changes the current directory.',
      run: (args) => {
        if (!args.length) { self.writeLine(self.cwd); return; }
        const target = args[0];
        // Handle "cd .." or "cd\" from drive root
        if (target === '..') {
          const parent = parentPath(self.cwd);
          const node = self.getNode(parent);
          if (node && node.type === 'dir') { self.cwd = parent; return; }
          return;
        }
        const norm = normalizePath(target, self.cwd);
        const node = self.getNode(norm);
        if (!node) { self.writeLine('The system cannot find the path specified.', 'err'); return; }
        if (node.type !== 'dir') { self.writeLine('The directory name is invalid.', 'err'); return; }
        self.cwd = norm.replace(/\\+$/, '') || 'C:\\';
      }
    };
    C.chdir = C.cd;

    /* ----- md / mkdir ----- */
    C.md = {
      desc: 'Creates a directory.',
      run: (args) => {
        if (!args.length) { self.writeLine('The syntax of the command is incorrect.', 'err'); return; }
        const path = normalizePath(args[0], self.cwd);
        if (self.getNode(path)) { self.writeLine('A subdirectory or file ' + args[0] + ' already exists.', 'err'); return; }
        const node = self.ensureDir(path);
        if (!node) self.writeLine('The system cannot find the path specified.', 'err');
      }
    };
    C.mkdir = C.md;

    /* ----- rd / rmdir ----- */
    C.rd = {
      desc: 'Removes a directory.',
      run: (args) => {
        const flags = args.filter(a => a.startsWith('/'));
        const paths = args.filter(a => !a.startsWith('/'));
        if (!paths.length) { self.writeLine('The syntax of the command is incorrect.', 'err'); return; }
        const path = normalizePath(paths[0], self.cwd);
        if (path.replace(/\\+$/, '').toLowerCase() === self.cwd.replace(/\\+$/, '').toLowerCase()) {
          self.writeLine('The process cannot access the file because it is being used by another process.', 'err'); return;
        }
        const node = self.getNode(path);
        if (!node) { self.writeLine('The system cannot find the file specified.', 'err'); return; }
        if (node.type !== 'dir') { self.writeLine('The directory name is invalid.', 'err'); return; }
        const isEmpty = !node.children || Object.keys(node.children).length === 0;
        const recursive = flags.some(f => /^\/s$/i.test(f));
        if (!isEmpty && !recursive) {
          self.writeLine('The directory is not empty.', 'err'); return;
        }
        const parent = self.getParentNode(path);
        const key = self.getKeyInParent(path);
        if (parent) {
          const k = Object.keys(parent.children).find(x => x.toLowerCase() === key.toLowerCase());
          if (k) delete parent.children[k];
        }
      }
    };
    C.rmdir = C.rd;

    /* ----- del / erase ----- */
    C.del = {
      desc: 'Deletes one or more files.',
      run: (args) => {
        const paths = args.filter(a => !a.startsWith('/'));
        if (!paths.length) { self.writeLine('The syntax of the command is incorrect.', 'err'); return; }
        const path = normalizePath(paths[0], self.cwd);
        const node = self.getNode(path);
        if (!node) { self.writeLine('Could Not Find ' + path, 'err'); return; }
        if (node.type === 'dir') { self.writeLine(path + '\\*', 'err'); self.writeLine('Access is denied.', 'err'); return; }
        const parent = self.getParentNode(path);
        const key = self.getKeyInParent(path);
        if (parent) {
          const k = Object.keys(parent.children).find(x => x.toLowerCase() === key.toLowerCase());
          if (k) delete parent.children[k];
        }
      }
    };
    C.erase = C.del;

    /* ----- copy ----- */
    C.copy = {
      desc: 'Copies one or more files to another location.',
      run: (args) => {
        const paths = args.filter(a => !a.startsWith('/'));
        if (paths.length < 2) { self.writeLine('The syntax of the command is incorrect.', 'err'); return; }
        const src = normalizePath(paths[0], self.cwd);
        const dst = normalizePath(paths[1], self.cwd);
        const srcNode = self.getNode(src);
        if (!srcNode) { self.writeLine('The system cannot find the file specified.', 'err'); return; }
        const dstNode = self.getNode(dst);
        let finalPath = dst;
        if (dstNode && dstNode.type === 'dir') {
          finalPath = dst + '\\' + baseName(src);
        }
        const parent = self.ensureDir(parentPath(finalPath));
        if (!parent) { self.writeLine('The system cannot find the path specified.', 'err'); return; }
        const key = baseName(finalPath);
        parent.children[key] = JSON.parse(JSON.stringify(srcNode));
        self.writeLine('        1 file(s) copied.');
      }

        if (paths.length < 2) { self.writeLine('The syntax of the command is incorrect.', 'err'); return; }
        const src = normalizePath(paths[0], self.cwd);
        let dst = normalizePath(paths[1], self.cwd);
        const srcNode = self.getNode(src);
        if (!srcNode) { self.writeLine('The system cannot find the file specified.', 'err'); return; }
        const dstNode = self.getNode(dst);
        if (dstNode && dstNode.type === 'dir') dst = dst + '\\' + baseName(src);
        const parent = self.ensureDir(parentPath(dst));
        if (!parent) { self.writeLine('The system cannot find the path specified.', 'err'); return; }
        const k = baseName(dst);
        parent.children[k] = srcNode;
        const srcParent = self.getParentNode(src);
        const srcKey = self.getKeyInParent(src);
        if (srcParent) {
          const sk = Object.keys(srcParent.children).find(x => x.toLowerCase() === srcKey.toLowerCase());
          if (sk) delete srcParent.children[sk];
        }
        self.writeLine('        1 file(s) moved.');
      }
    };

        const src = normalizePath(args[0], self.cwd);
        const newNodeName = args[1];
        const parent = self.getParentNode(src);
        const srcKey = self.getKeyInParent(src);
        if (!parent) { self.writeLine('The system cannot find the file specified.', 'err'); return; }
        const actualKey = Object.keys(parent.children).find(x => x.toLowerCase() === srcKey.toLowerCase());
        if (!actualKey) { self.writeLine('The system cannot find the file specified.', 'err'); return; }
        parent.children[newNodeName] = parent.children[actualKey];
        delete parent.children[actualKey];
      }

        const node = self.getNode(norm);
        if (!node || node.type !== 'dir') { self.writeLine('Invalid path - ' + target, 'err'); return; }
        self.writeLine('Folder PATH listing for volume C');
        self.writeLine('Volume serial number is A1B2-C3D4');
        self.writeLine(norm);
        const walk = (n, prefix) => {
          const keys = Object.keys(n.children || {}).sort();
          keys.forEach((k, i) => {
            const last = i === keys.length - 1;
            const child = n.children[k];
            self.writeLine(prefix + (last ? '└───' : '├───') + k);
            if (child.type === 'dir') walk(child, prefix + (last ? '    ' : '│   '));

        const path = normalizePath(file, self.cwd);
        const node = self.getNode(path);
        if (!node || node.type === 'dir') { self.writeLine('FIND: File not found - ' + file, 'err'); return; }
        const target = q.replace(/"/g, '');
        let found = false;
        (node.content || '').split('\n').forEach(l => {
          if (l.toLowerCase().includes(target.toLowerCase())) {
            self.writeLine(l); found = true;

        if (!found) self.writeLine('---------- ' + baseName(path));

        const path = normalizePath(file, self.cwd);

        try {

        self.writeLine('');

          self.writeLine('Reply from ' + ip + ': bytes=32 time=' + t + ' TTL=' + (isLocalhost?128:117));

    C.fc = {
      desc: 'Compares two files or sets of files.',
      run: (args) => {
        const files = args.filter(a => !a.startsWith('/'));
        if (files.length < 2) { self.writeLine('The syntax of the command is incorrect.', 'err'); return; }
        const a = self.getNode(normalizePath(files[0], self.cwd));
        const b = self.getNode(normalizePath(files[1], self.cwd));
        if (!a || !b) { self.writeLine('The system cannot find the file specified.', 'err'); return; }
        self.writeLine('Comparing files ' + baseName(files[0]).toUpperCase() + ' and ' + baseName(files[1]).toUpperCase());
        if ((a.content || '') === (b.content || '')) {
          self.writeLine('FC: no differences encountered');
        } else {
          self.writeLine('***** Files differ *****', 'warn');
        }
      }
    };

    return C;
  }

  /* ---------- Dir line formatter ---------- */
  formatDirLine(name, node) {
    const size = node.type === 'dir' ? '' : fmtBytes(node.size || 0);
    const date = fmtDate(new Date());
    const dirTag = node.type === 'dir' ? '<DIR>' : '     ';
    const nm = node.type === 'dir' ? name.toUpperCase() : name;
    return date + '    ' + dirTag + '          ' + (size ? size.padStart(12) : '            ') + ' ' + nm;
  }
  printFileLine(name, node, bare) {
    if (bare) { this.writeLine(name); return; }
    this.writeLine(this.formatDirLine(name, node));
  }

  /* ---------- Input binding ---------- */
  bindInput() {
    this.inputEl.addEventListener('keydown', e => this.onKey(e));
    document.getElementById('screen').addEventListener('click', e => {
      if (!e.target.closest('input')) this.inputEl.focus();
    });
  }

  onKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const line = this.inputEl.value;
      this.inputEl.value = '';
      this.handleLine(line);
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (this.history.length === 0) return;
      if (this.histIdx === 0) this.histIdx = this.history.length;
      this.histIdx = Math.max(0, this.histIdx - 1);
      this.inputEl.value = this.history[this.histIdx] || '';
      setTimeout(() => {
        this.inputEl.selectionStart = this.inputEl.selectionEnd = this.inputEl.value.length;
      }, 0);
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (this.history.length === 0) return;
      this.histIdx = Math.min(this.history.length, this.histIdx + 1);
      this.inputEl.value = this.histIdx >= this.history.length ? '' : this.history[this.histIdx];
      return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      this.tabComplete();
      return;
    }
    if (e.key === 'c' && e.ctrlKey) {
      e.preventDefault();
      this.writeLine('^C');
      this.inputEl.value = '';
      this.waitingFor = null;
      this.writeLine('');
      this.updatePrompt();
      return;
    }
    if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      this.clear();
      return;
    }
    if (e.key === 'F7') {
      e.preventDefault();
      this.showHistoryPopup();
      return;
    }
  }

  /* ---------- Tab completion ---------- */
  tabComplete() {
    const val = this.inputEl.value;
    const parts = val.split(/\s+/);
    const lastToken = parts[parts.length - 1];
    let candidates = [];
    if (parts.length === 1 && !val.includes(' ')) {
      // Command name
      const prefix = val.toLowerCase();
      candidates = Object.keys(this.commands).filter(k => k.startsWith(prefix)).sort();
    } else {
      // File name in current dir
      const node = this.getNode(this.cwd);
      if (node && node.children) {
        const prefix = lastToken.replace(/[\\/].*$/, '');
        const search = lastToken.replace(/^.*[\\/]/, '').toLowerCase();
        candidates = Object.keys(node.children).filter(k => k.toLowerCase().startsWith(search));
      }
    }
    if (!candidates.length) return;
    if (candidates.length === 1) {
      const replacement = candidates[0];
      if (parts.length === 1 && !val.includes(' ')) {
        this.inputEl.value = replacement;
      } else {
        parts[parts.length - 1] = replacement;
        this.inputEl.value = parts.join(' ');
      }
    } else {
      // Print common prefix and list
      let cp = candidates[0];
      candidates.slice(1).forEach(c => {
        let i = 0;
        while (i < cp.length && i < c.length && cp[i].toLowerCase() === c[i].toLowerCase()) i++;
        cp = cp.substring(0, i);
      });
      if (cp.length > lastToken.replace(/^.*[\\/]/, '').length) {
        if (parts.length === 1) this.inputEl.value = cp;
        else { parts[parts.length - 1] = cp; this.inputEl.value = parts.join(' '); }
      } else {
        this.writeLine('');
        candidates.forEach(c => this.writeLine(c));
        this.updatePrompt();
        this.inputEl.value = val;
      }
    }
  }

  showHistoryPopup() {
    this.writeLine('');
    this.history.forEach((h, i) => this.writeLine('  ' + (i + 1) + '  ' + h));
    this.writeLine('');
  }

  /* ---------- Line handler ---------- */
  handleLine(line) {
    // Handle waiting states
    if (this.waitingFor) {
      const w = this.waitingFor;
      this.waitingFor = null;
      this.writeLine(line);
      if (w.type === 'pause') {
        this.writeLine('');
        this.updatePrompt();
        return;
      }
      if (w.type === 'date' || w.type === 'time') {
        if (!line.trim()) {
          this.updatePrompt();
          return;
        }
        this.writeLine('The system cannot accept the ' + w.type + ' entered.');
        this.updatePrompt();
        return;
      }
    }

    // Echo the input (as Windows does)
    this.write(this.getPromptString() + line + '\n');

    const trimmed = line.trim();
    if (!trimmed) { this.updatePrompt(); return; }

    // Store history
    this.history.push(trimmed);
    this.histIdx = this.history.length;

    this.execute(trimmed);
    this.updatePrompt();
  }

  execute(cmdline) {
    // Expand environment variables first
    const expanded = this.expandVars(cmdline);
    // Handle && and || (basic)
    const chain = this.splitChain(expanded);
    if (chain.length > 1) {
      this.runChain(chain, 0);
      return;
    }
    this.runSingle(expanded);
  }

  splitChain(line) {
    // Split on && and || but not inside quotes
    const parts = [];
    let buf = '';
    let inQ = false;
    let i = 0;
    while (i < line.length) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; buf += c; i++; continue; }
      if (!inQ && c === '&' && line[i+1] === '&') {
        parts.push({ cmd: buf.trim(), op: 'AND' });
        buf = '';
        i += 2;
        continue;
      }
      if (!inQ && c === '|' && line[i+1] === '|') {
        parts.push({ cmd: buf.trim(), op: 'OR' });
        buf = '';
        i += 2;
        continue;
      }
      buf += c;
      i++;
    }
    if (buf.trim()) parts.push({ cmd: buf.trim(), op: null });
    return parts;
  }

  runChain(chain, idx) {
    if (idx >= chain.length) return;
    const part = chain[idx];
    this.runSingle(part.cmd, (success) => {
      const op = part.op;
      if (!op) return;
      if (op === 'AND' && success) this.runChain(chain, idx + 1);
      else if (op === 'OR' && !success) this.runChain(chain, idx + 1);
      else if (op === 'AND' && !success) return;
      else if (op === 'OR' && success) return;
    });
  }

  runSingle(line, cb) {
    const tokens = this.tokenize(line);
    if (!tokens.length) { cb && cb(true); return; }
    const cmd = tokens[0].toLowerCase();
    const args = tokens.slice(1);
    const raw = line;

    const handler = this.commands[cmd];
    if (handler) {
      try {
        handler.run(args, raw);
        cb && cb(true);
      } catch (err) {
        this.writeLine('Error: ' + err.message, 'err');
        cb && cb(false);
      }
    } else {
      // Not a builtin — check if it's an .exe / .bat
      const clean = cmd.replace(/\.(exe|com|bat|cmd)$/, '');
      if (this.commands[clean]) {
        this.commands[clean].run(args, raw);
        cb && cb(true);
      } else {
        this.writeLine("'" + cmd + "' is not recognized as an internal or external command,", 'err');
        this.writeLine('operable program or batch file.', 'err');
        cb && cb(false);
      }
    }
  }

  tokenize(line) {
    const out = [];
    let buf = '';
    let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (!inQ && /\s/.test(c)) {
        if (buf) { out.push(buf); buf = ''; }
        continue;
      }
      buf += c;
    }
    if (buf) out.push(buf);
    return out;
  }

  exit() {
    this.running = false;
    this.onExit();
  }
}

/* ============================================================
   Bootstrap standalone
   ============================================================ */
window.__cmd = new WindowsCMD({
  output: document.getElementById('output'),
  input: document.getElementById('cmdInput'),
  promptTxt: document.getElementById('promptTxt'),
  titleEl: document.getElementById('winTitle')
});

// Focus on load
document.getElementById('screen').focus();
document.getElementById('cmdInput').focus();
</script>
